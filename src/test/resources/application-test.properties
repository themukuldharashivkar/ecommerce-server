# Automated tests. Dummy values only; Razorpay is never called (PaymentGateway is mocked).
# The datasource points at a throwaway Testcontainers PostgreSQL (see IntegrationTest),
# migrated by the real Flyway scripts.
spring.jpa.show-sql=false
app.seed.enabled=false

JWT_SECRET=test-only-jwt-secret-0123456789abcdef0123456789
RAZORPAY_KEY_ID=rzp_test_dummy
RAZORPAY_KEY_SECRET=dummy
FRONTEND_URL=http://frontend.test

ADMIN_EMAIL=admin@test.local
ADMIN_PASSWORD=admin-password-123

# In-memory cache for tests; CachingIntegrationTest switches to a real Redis container
spring.cache.type=simple

# Notifications: tests call the sweeper directly, so the schedule never fires during a run,
# and grace/backoff are zero so due rows are picked up immediately.
app.notifications.sweep-interval=PT1H
app.notifications.pending-grace=PT0S
app.notifications.retry-backoff=PT0S
app.mail.enabled=false

# Tests sign up hundreds of users from one address; RateLimitIntegrationTest sets real limits
app.rate-limit.signin.requests=1000000
app.rate-limit.signup.requests=1000000
