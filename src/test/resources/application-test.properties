# Automated tests. Dummy values only; Razorpay is never called from tests.
# Uses its own database so create-drop never touches dev data.
# (Step 2 replaces this with a throwaway Testcontainers PostgreSQL.)
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/ecommerce_test?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

JWT_SECRET=test-only-jwt-secret-0123456789abcdef0123456789
RAZORPAY_KEY_ID=rzp_test_dummy
RAZORPAY_KEY_SECRET=dummy
