# Production. Every secret must come from the environment:
# JWT_SECRET, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, DB_* (or DB_URL),
# CORS_ALLOWED_ORIGINS and FRONTEND_URL. The app fails to start if a secret is missing.
spring.jpa.show-sql=false
# Deployed behind the hosting provider's proxy: take the client IP from X-Forwarded-For
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}
