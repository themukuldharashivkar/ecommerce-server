# Shared settings for every profile.
# Anything that differs between environments comes from environment variables.
# See .env.example for the full list.

# dev is used when SPRING_PROFILES_ACTIVE is not set
spring.profiles.default=dev

server.port=${PORT:5454}

# Database (variable names kept compatible with the existing deployment)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ecommerce}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JWT: HMAC secret, at least 32 bytes (256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay (test mode keys only)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Comma-separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Where Razorpay sends the shopper back after payment
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
