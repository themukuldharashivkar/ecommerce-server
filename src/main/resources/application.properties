# Shared settings for every profile.
# Anything that differs between environments comes from environment variables.
# See .env.example for the full list.

# dev is used when SPRING_PROFILES_ACTIVE is not set
spring.profiles.default=dev

server.port=${PORT:5454}

# Database: PostgreSQL. Set DB_URL, or DB_HOST/DB_PORT/DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}}
spring.datasource.username=${DB_USERNAME:bazaarly}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate

# Load the 499 demo products into an empty catalog on startup
app.seed.enabled=${SEED_ENABLED:true}

# JWT: HMAC secret, at least 32 bytes (256 bits)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Razorpay (test mode keys only)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Comma-separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Where Razorpay sends the shopper back after payment
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Admin account created (or promoted) on startup; admins cannot sign up through the API
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Cache for the public catalog endpoints. CACHE_TYPE: redis | simple (in-memory) | none
spring.cache.type=${CACHE_TYPE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl=${REDIS_SSL:false}
# fail fast when Redis is unreachable; the request then falls back to the database (CacheConfig)
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
# Entries are evicted on every product/review/rating change; TTLs are only a safety net
app.cache.catalog-ttl=${CACHE_CATALOG_TTL:PT10M}
app.cache.product-ttl=${CACHE_PRODUCT_TTL:PT30M}

# Order-confirmation emails (background job). MAIL_ENABLED=false only logs them.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Bazaarly <orders@bazaarly.local>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.notifications.pool-size=2
app.notifications.queue-capacity=100
app.notifications.max-attempts=5
# FAILED rows wait attempts x retry-backoff before the next try
app.notifications.retry-backoff=PT1M
app.notifications.sweep-interval=PT30S
# PENDING rows the async job never started are picked up after this
app.notifications.pending-grace=PT2M
app.notifications.sending-timeout=PT10M
