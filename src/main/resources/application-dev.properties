# Local development.
# Put real values (DB password, Razorpay test keys) in a git-ignored .env file
# in the project root; it is loaded here if present. Copy .env.example to start.
spring.config.import=optional:file:.env[.properties]

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Dev-only fallback so the app starts without a .env. Never used in prod.
JWT_SECRET=dev-only-jwt-secret-change-me-0123456789abcdef
