# Render Blueprint: the Bazaarly API (Docker) and its PostgreSQL database.
# Redis comes from Upstash and the storefront from Vercel. See docs/DEPLOYMENT.md.
# Values marked "sync: false" are entered in the Render dashboard when the Blueprint is created.

services:
  - type: web
    name: bazaarly-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Free instance: 512 MB, 0.1 CPU. C1-only JIT and the serial GC cut startup from ~305 s to ~122 s
      # in a local rehearsal under the same limits (docs/DEPLOYMENT.md).
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1 -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m

      # PostgreSQL (internal connection inside Render's network)
      - key: DB_HOST
        fromDatabase: { name: bazaarly-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: bazaarly-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: bazaarly-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: bazaarly-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: bazaarly-db, property: password }

      # a random 256-bit secret generated by Render, never in git
      - key: JWT_SECRET
        generateValue: true

      # Razorpay TEST mode keys (create new ones: the old ones are in this repo's history)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

      # the storefront's URL(s): CORS and the Razorpay return address
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false

      # admin and public demo accounts (created on startup)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_SHOPPER_EMAIL
        sync: false
      - key: DEMO_SHOPPER_PASSWORD
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false

      # Upstash Redis (TLS)
      - key: CACHE_TYPE
        value: redis
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"

      # no SMTP server in this deployment: order confirmations are logged, not emailed
      - key: MAIL_ENABLED
        value: "false"

      # Render's proxy sets X-Forwarded-For: use it for the client IP (rate limiting)
      - key: FORWARD_HEADERS_STRATEGY
        value: framework

databases:
  - name: bazaarly-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: ecommerce
    user: bazaarly
    ipAllowList: []   # no access from the internet; only services in this Render account
